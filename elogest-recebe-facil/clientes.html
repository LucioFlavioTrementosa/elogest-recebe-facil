<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ============================================================
    Elogest Recebe Fácil — clientes.html
    Lista de clientes cadastrados (dados simulados — js/store.js).
    ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="assets/icon-elogest.webp">
    <title>Elogest Recebe Fácil — Clientes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="overlay" id="overlay"></div>

        <main class="conteudo-principal">
            <header class="header" id="header"></header>

            <div class="conteudo-area">

                <div class="pagina-titulo-area--com-acao">
                    <div>
                        <h1 class="titulo-pagina">Clientes</h1>
                        <p class="descricao-pagina">Gerencie os clientes cadastrados no sistema</p>
                    </div>
                    <a href="cadastro-cliente.html" class="btn-primario">+ Novo Cliente</a>
                </div>

                <div class="busca-container">
                    <svg class="busca-container__icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" class="busca-container__input" placeholder="Buscar cliente por nome, telefone ou CPF/CNPJ..." id="busca_cliente">
                </div>

                <div class="clientes-grid" id="clientes-grid">
                    <div class="skeleton-card"><div class="skeleton skeleton-avatar"></div><div style="flex:1"><div class="skeleton skeleton-linha" style="margin-bottom:8px"></div><div class="skeleton skeleton-linha skeleton-linha--curta"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-avatar"></div><div style="flex:1"><div class="skeleton skeleton-linha" style="margin-bottom:8px"></div><div class="skeleton skeleton-linha skeleton-linha--curta"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-avatar"></div><div style="flex:1"><div class="skeleton skeleton-linha" style="margin-bottom:8px"></div><div class="skeleton skeleton-linha skeleton-linha--curta"></div></div></div>
                </div>

            </div>

            <footer class="rodape" id="rodape"></footer>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/store-api.js"></script>
    <script src="js/format.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
