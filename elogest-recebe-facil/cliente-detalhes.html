<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ============================================================
    Elogest Recebe Fácil — cliente-detalhes.html
    Perfil do cliente: mini CRM (produtos mais comprados, gasto
    total) + histórico de débitos. ID via query string:
    cliente-detalhes.html?id=1 (dados simulados — js/store.js).
    ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="assets/icon-elogest.webp">
    <title>Elogest Recebe Fácil — Perfil do Cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="overlay" id="overlay"></div>

        <main class="conteudo-principal">
            <header class="header" id="header"></header>

            <div class="conteudo-area">

                <div class="pagina-titulo-area">
                    <h1 class="titulo-pagina">Perfil do Cliente</h1>
                    <p class="descricao-pagina">Histórico de relacionamento e produtos mais comprados</p>
                </div>

                <div id="conteudo-perfil">
                    <div class="skeleton-card" style="height:110px;margin-bottom:24px;">
                        <div class="skeleton skeleton-avatar" style="width:64px;height:64px;"></div>
                        <div style="flex:1"><div class="skeleton skeleton-linha" style="margin-bottom:8px;width:50%"></div><div class="skeleton skeleton-linha skeleton-linha--curta"></div></div>
                    </div>
                </div>

            </div>

            <footer class="rodape" id="rodape"></footer>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/store-api.js"></script>
    <script src="js/format.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/whatsapp.js"></script>
    <script src="js/cliente-detalhes.js"></script>
</body>
</html>
